name: Ports list

# Every day, read the Quiver Launcher catalog's Android ports, check which ones really ship an
# Android build, and publish ports.json.gz on the "catalog" release for the app's Ports mode.
on:
  schedule:
    - cron: "41 5 * * *"   # daily, 05:41 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ports
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build ports list
        run: python3 scripts/build_ports.py ports.json.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload catalog ports.json.gz --clobber
