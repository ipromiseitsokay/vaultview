name: Build and release

# Every push to main builds a signed APK and publishes it as a GitHub release.
# The app's updater looks at the latest release and offers to install it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Bundle the latest game catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets
          gh release download catalog -p catalog.json.gz -D app/src/main/assets --clobber || echo "No catalog yet; the app will fetch lists itself"

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then echo "::error::SIGNING_KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Test and build
        env:
          VERSION_CODE: ${{ github.run_number }}
          UPDATE_REPO: ${{ github.repository }}
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: vaultview
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest --tests '*ParseTest' --tests '*ExtractorTest' assembleRelease
          cp app/build/outputs/apk/release/app-release.apk VaultView.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" VaultView.apk --title "VaultView 1.0.${{ github.run_number }}" --notes "${NOTES:-Manual build}"
